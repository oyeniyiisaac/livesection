<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Item List</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <style>
        body {
            background-color: #f2f4f7;
            color: #1f2937;
            min-height: 100vh;
        }

        .app-card {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            box-shadow: 0 8px 20px rgba(31, 41, 55, 0.08);
        }

        .app-title {
            color: #0f172a;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <section class="col-12 col-sm-11 col-md-9 col-lg-7 col-xl-6">
                <div class="app-card p-3 p-md-4">
                    <h1 class="app-title h4 text-center mb-4">My Item List</h1>
                    <div class="alert alert-danger" style="display: none;" role="alert" id="alert">
                        input cannot be empty!
                    </div>
                    <div class="alert alert-success" style="display: none;" role="alert" id="alertItem">
                        your item is already exist!
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-12 col-md-8">
                            <input
                                type="text"
                                class="form-control"
                                placeholder="Add your item"
                                id="itemInput"
                            >
                        </div>
                        <div class="col-12 col-md-4 d-grid">
                            <button class="btn btn-primary" onclick="addItem()">Add Item</button>
                        </div>
                    </div>

                    <div id="showItems" class="d-grid gap-2"></div>
                </div>
            </section>
        </div>
    </main>
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Edit your Item</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" placeholder="Add your item" id="editInput">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="editItem()">Item Edited</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Delete your item</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete!
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal" onclick="delItem()">Delete</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
